name: CUUP, Inc.
description: 'CUUP, Inc. is a New York City-based direct-to-consumer intimates brand
  founded in 2018 by Abby Morgan and Kearnon O''Molony, offering precision-fit bras,
  underwear, loungewear, apparel, and swim across an extended range of cup and band
  sizes sold through its shopcuup.com online store. Backed by Insight Partners and
  Forerunner Ventures, CUUP was acquired by FULLBEAUTY Brands in July 2023 and now
  runs on the FULLBEAUTY commerce platform. As a consumer retail company it exposes
  no public developer API; this API Evangelist profile captures its public web presence,
  domain security posture, and commercial policy pages.'
